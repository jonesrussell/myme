# Linux/WSL2-specific tasks for MyMe.
# Included by Taskfile.yml via {{OS}} — do not run directly.

version: '3'

tasks:
  build:
    desc: Build Rust crates and Qt application (release).
    env:
      QMAKE: /usr/bin/qmake6
    cmds:
      - cargo build --release
      - cmake -B build-qt -DCMAKE_BUILD_TYPE=Release
      - cmake --build build-qt

  build:rust:
    desc: Build non-Qt crates only (no Qt headers required).
    cmds:
      - cargo build --release -p myme-core -p myme-services -p myme-auth -p myme-integrations -p myme-weather -p myme-gmail -p myme-calendar

  run:
    desc: Run Qt application. Requires build first.
    cmds:
      - ./build-qt/myme-qt

  clean:qt:
    desc: Remove Qt build directory (build-qt).
    cmds:
      - rm -rf build-qt
