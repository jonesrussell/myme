# MyMe project tasks. See https://taskfile.dev
# OS-specific tasks (build, run) are in Taskfile_windows.yml / Taskfile_linux.yml.

version: '3'

includes:
  os:
    taskfile: ./Taskfile_{{OS}}.yml

vars:
  TEST_PACKAGES: >
    -p myme-core
    -p myme-services
    -p myme-auth
    -p myme-integrations
    -p myme-weather
    -p myme-gmail
    -p myme-calendar

tasks:
  default:
    desc: List all tasks.
    cmds:
      - task --list-all

  build:
    desc: Build Rust crates (release). Delegates to OS-specific build.
    cmds:
      - task: os:build

  run:
    desc: Run Rust binary (no UI). Delegates to OS-specific run.
    cmds:
      - task: os:run

  test:
    desc: Run tests for all crates except myme-ui (no Qt in test env).
    cmds:
      - cargo test --no-fail-fast {{.TEST_PACKAGES}}

  fmt:
    desc: Format Rust code.
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check Rust formatting (CI).
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: Run Clippy on testable crates (excludes myme-ui).
    env:
      RUSTFLAGS: -D warnings
    cmds:
      - cargo clippy --all-targets --no-deps {{.TEST_PACKAGES}}

  clean:
    desc: Remove Cargo build artifacts.
    cmds:
      - cargo clean

  lint:
    desc: Run fmt check and clippy (same as CI).
    cmds:
      - task: fmt:check
      - task: clippy
